name: Verify metaBrain 1.3.0 on Ubuntu ARM64
on:
  push:
    branches: [codex/verify-1.3.0-arm64]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    container: swift:6.3.2-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build from the release commit and smoke-test both package formats
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq dpkg-dev ripgrep
          bash .github/scripts/verify-release-linux.sh 02e22249ce880ae458875e6c4112a26f1a2b563a | tee arm64-build.log
          work=$(sed -n 's/^BUILD_DIR=//p' arm64-build.log)
          mkdir -p validated
          cp "$work"/dist/mb-1.3.0-linux-aarch64.tar.gz* "$work"/dist/metabrain_1.3.0_arm64.deb* validated/
      - uses: actions/upload-artifact@v4
        with:
          name: verified-metabrain-1.3.0-ubuntu-arm64
          path: validated/
          if-no-files-found: error
          retention-days: 1
